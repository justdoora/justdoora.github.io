<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Test Site</title>
    <!-- Fixed Cloud CSS Link -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- MAIN CONTENT -->
    <main class="max-w-2xl mx-auto px-6 py-12 text-center">
        <!-- Profile Picture Placeholder -->
        <div class="mb-6">
            <img src="profile.jpg" alt="Profile Picture" class="w-32 h-32 rounded-full mx-auto object-cover border-2 border-emerald-400">
        </div>

        <h1 class="text-4xl font-extrabold text-zinc-50 mb-2">Hello World, I'm Deepali!</h1>
        <p class="text-emerald-400 font-mono text-sm mb-6">Bsc Student studying Biology </p>
        
        <p class="text-zinc-400 text-base mb-12">
            a girl who is a little complicated, deeply emotional, ambitious, imaginative, and full of contradictions in the most human way.
        </p>

        <!-- PROJECT PICTURES GRID -->
        <h2 class="text-xl font-bold text-zinc-200 mb-4 text-left">Gallery:</h2>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-zinc-800 p-2 rounded border border-zinc-700">
                <img src="project1.jpg" alt="Project 1" class="w-full h-40 object-cover rounded mb-2">
                <p class="text-xs text-zinc-400 font-mono">project1.jpg</p>
            </div>
            <div class="bg-zinc-800 p-2 rounded border border-zinc-700">
                <img src="project2.jpg" alt="Project 2" class="w-full h-40 object-cover rounded mb-2">
                <p class="text-xs text-zinc-400 font-mono">project2.jpg</p>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs font-mono text-zinc-500 border-t border-zinc-800">
        Jharsuguda Odisa India
    </footer>

</body>
</html>
